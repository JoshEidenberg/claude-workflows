name: Claude Worker (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      claude_args: ${{ steps.compute.outputs.claude_args }}
    steps:
      - name: Compute claude_args from issue labels
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Cost-aware model selection. Default to the cheapest model that can do the work.
          # Approx pricing per 1M tokens (input / output):
          #   Haiku 4.5:  $0.80 / $4    — small tweaks, single-file changes, research summaries
          #   Sonnet 4.5: $3    / $15   — multi-file features, bug investigations
          #   Opus 4.5:   $15   / $75   — complex architectural work, large refactors
          #
          # The defaults below assume the average ticket is Haiku-tier.

          MODEL="claude-haiku-4-5"
          THINKING=""

          if [ -n "${ISSUE:-}" ]; then
            LABELS=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          else
            LABELS=""
          fi
          echo "labels: $LABELS"

          has() { echo "$LABELS" | grep -q "^$1$"; }

          # 1) Explicit depth label always wins
          if has 'depth:max'; then
            MODEL="claude-opus-4-5"
            THINKING="--max-thinking-tokens 16000"
          elif has 'depth:thorough'; then
            MODEL="claude-opus-4-5"
          elif has 'depth:standard'; then
            MODEL="claude-sonnet-4-5"
          elif has 'depth:quick'; then
            MODEL="claude-haiku-4-5"
          else
            # 2) Heuristic from type + size — defaults to Haiku, escalates only when needed.

            # Size buckets — the strongest signal
            SIZE="M" # treat "no size label" as M
            if has 'size:XS'; then SIZE="XS";
            elif has 'size:S'; then SIZE="S";
            elif has 'size:M'; then SIZE="M";
            elif has 'size:L'; then SIZE="L";
            fi

            # Type modifiers
            TYPE="feature" # default assumption
            if has 'type:epic'; then TYPE="epic";
            elif has 'type:research'; then TYPE="research";
            elif has 'type:chore'; then TYPE="chore";
            elif has 'type:bug'; then TYPE="bug";
            elif has 'type:feature'; then TYPE="feature";
            fi

            # Decision matrix
            case "$SIZE-$TYPE" in
              # XS and S: always Haiku — these are tiny scoped changes, Haiku handles fine
              XS-*|S-*) MODEL="claude-haiku-4-5" ;;

              # Research at any size — Haiku is fine (it's mostly reading + summarizing)
              *-research) MODEL="claude-haiku-4-5" ;;

              # Chore at any size — usually cosmetic / mechanical, Haiku is fine
              *-chore) MODEL="claude-haiku-4-5" ;;

              # Epic — generates child tickets, structured but small output. Haiku is fine.
              *-epic) MODEL="claude-haiku-4-5" ;;

              # Medium feature or bug — Sonnet
              M-feature|M-bug) MODEL="claude-sonnet-4-5" ;;

              # Large feature or bug — Opus
              L-feature|L-bug) MODEL="claude-opus-4-5" ;;

              # Anything else falls back to Haiku (safer for cost; user can override with depth:standard)
              *) MODEL="claude-haiku-4-5" ;;
            esac
          fi

          ARGS="--allowed-tools \"Bash,Edit,Read,Write,Glob,Grep\" --model $MODEL"
          if [ -n "$THINKING" ]; then ARGS="$ARGS $THINKING"; fi
          echo "claude_args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved claude_args: $ARGS (size=${SIZE:-?} type=${TYPE:-?})"

  work:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude:go"
          claude_args: ${{ needs.resolve.outputs.claude_args }}
          # Surface Claude's reasoning and a final report as comments on the issue/PR.
          # Without these, the SDK can run successfully but leave nothing visible behind.
          track_progress: "true"
          display_report: "true"
          show_full_output: "true"
          prompt: |
            # Label-aware operating instructions

            ## You MUST end with a visible artifact on the issue

            Every run MUST end with at least ONE of: a pushed branch, an opened PR, or a comment on the issue. If you exit without any of these, the user has no signal that anything happened — that is a bug. Even if you decide to do nothing (e.g. you couldn't reproduce a bug, or the ticket is too vague), POST A COMMENT explaining your decision.

            **First, inspect the issue's labels** with `gh issue view <number> --json labels --jq '.labels[].name'`. Your behavior depends on them.

            ## Type label dictates the deliverable

            - **`type:epic`** — Master ticket. Your task is to break this into sub-tickets, not to implement it.
              - Read the master issue body carefully. Identify 3–8 concrete, independently-shippable sub-tasks.
              - For each sub-task, decide its `type:` (feature / bug / chore / research) and `size:` (XS / S / M).
              - **If any sub-task would still be size:L**, decompose it further — the goal is right-sized work.
              - Create each sub-ticket with `gh issue create`, passing `--title`, a markdown `--body` with Context / Acceptance criteria / Out of scope sections, and `--label "type:X,size:Y,status:ready"`. Include "Part of #<EPIC_NUMBER>" in each body.
              - Do NOT add `claude:go` to the children — leave that for the user to trigger them individually.
              - After creating all children, post ONE comment on the epic listing the children as a checklist: `- [ ] #N — title`.
              - **End state of the epic:** the epic should sit in the user's "Ready" column alongside its children, not Waiting. Run:
                - `gh issue edit <EPIC_NUMBER> --remove-label claude:go`
                - `gh issue edit <EPIC_NUMBER> --add-label status:ready`
                - Do NOT add `claude:needs-review` to the epic.
              - Do NOT write code, create a branch, or open a PR for the epic itself.

            - **`type:research`** — Investigation, not implementation.
              - Do NOT write code, create a branch, or open a PR.
              - Investigate the question (read code, fetch docs, run read-only commands).
              - Post ONE thorough comment on the issue with findings and a recommendation. Use markdown — headings, bullets, code spans, links.
              - Cite file paths with line numbers when referencing code. Quote and link sources when referencing docs.
              - Leave the issue open; the user closes it after reading.

            - **`type:bug`** — Defect fix.
              - Start by reproducing the bug. Write a failing test that captures the broken behavior BEFORE changing source code.
              - Then make the minimum change needed to make the test pass.
              - In the PR description, include: "Root cause", "Fix", and "Test output" sections.
              - If you can't reproduce, post a comment with what you tried and what's needed from the user — do NOT open a PR.

            - **`type:feature`** — New capability.
              - Implement the acceptance criteria exactly. Don't expand scope.
              - Add tests covering the new behavior.
              - Follow conventions in CLAUDE.md (commit style, branch naming, off-limits).

            - **`type:chore`** — Maintenance / refactor / docs.
              - Keep the diff tight. No drive-by changes outside what the ticket asks.
              - Tests only if behavior actually changes.

            ## ALWAYS open the PR yourself for code tickets

            After you push the branch for a `type:feature`, `type:bug`, or `type:chore` ticket, you MUST run `gh pr create` yourself. Do not just leave a branch link in the comment for the user to click. Specifically:

            ```bash
            gh pr create \
              --title "<short imperative subject>" \
              --body "$(cat <<'EOF'
            Closes #<ISSUE_NUMBER>

            ## What changed
            <one-paragraph summary>

            ## Why
            <link to issue context or restate the problem>

            ## Testing
            <paste relevant test output here>
            EOF
            )"
            ```

            Only skip `gh pr create` if the ticket is `type:research` or `type:epic` (which have their own non-PR deliverables), or if you couldn't reproduce a bug and chose to comment instead.

            - **No type label** — Treat as `type:feature` but call out the missing label in the PR description so the user can add one.

            ## Size label is a budget

            - **`size:XS`** — Should be ~30 lines of diff or less. If you find yourself touching multiple files or modules, stop and post a comment proposing a breakdown.
            - **`size:S`** — A focused change in one or two files. Same stop-and-discuss rule if scope balloons.
            - **`size:M`** — Half-day of work, may touch a few related files.
            - **`size:L`** — Likely too big for one PR. **Do NOT just plow through.** Post a comment proposing a breakdown into 2-5 smaller tickets and wait for the user. Only proceed if the user replies confirming you should do it as one. (This rule does not apply to `type:epic` — epics are explicitly meant to be broken down.)
            - No size label — proceed but flag it in the PR description so the user can size it in retrospect.

            ## Status / claude labels

            - **`claude:freeze`** — Should not happen (picker filters these), but if you see it on the repo: stop, post a comment that you noticed the freeze, do nothing else.
            - **`status:blocked`** or **`claude:blocked`** — Something is expected to need user input. Read the issue body and comments first; if the blocker is gone, proceed and remove the label. If still blocked, comment to clarify what's needed.

            ## Across all types — house rules

            - Always read `CLAUDE.md` first. Honor every off-limits entry.
            - If acceptance criteria are vague or untestable, do NOT guess. Post a comment with your interpretation as proposed AC bullets and wait. (Epics are an exception — for an epic, your job is to invent the AC for each sub-ticket.)
            - Run tests and any linters/typecheckers defined in CLAUDE.md before pushing.
            - If tests fail and the fix is unclear, push what you have and post a comment describing the failure rather than silently force-passing.
            - Branch naming: `claude/issue-<number>-<short-slug>`. Commit subjects: short imperative, no scope prefixes unless CLAUDE.md says otherwise.
            - PR descriptions: link the issue (`Closes #N`), describe what changed and why, paste relevant test output.
